<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf0e6">
  <title>林间</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="sketch.js" defer></script>
</head>
<body>
  <main class="poster">
    <div id="forest-canvas" class="canvas-frame" aria-label="可交互的树林画面"></div>
    <footer class="controls">
      <p class="instruction">移动鼠标，或用手指在画面上滑动</p>
      <button type="button" class="regenerate" onclick="regenerateForest()">重新生成森林</button>
    </footer>
  </main>
</body>
</html>
